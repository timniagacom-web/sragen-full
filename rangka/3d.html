<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Bangunan 3D · Gudang Sragen</title>
<style>
  :root{--navy:#0e2642;--biru:#1f5fa8;--garis:#d5e0ea}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;font-family:"Segoe UI",system-ui,sans-serif;color:var(--navy);background:#dbe9f5}
  canvas{display:block;touch-action:none}
  .kotak{position:fixed;background:rgba(255,255,255,.95);border:1px solid var(--garis);border-radius:12px;box-shadow:0 4px 18px rgba(14,38,66,.14);z-index:2}
  header{left:12px;top:12px;padding:10px 14px;max-width:min(430px,calc(100vw - 24px))}
  header h1{font-size:16px;line-height:1.3}
  #beranda{font-size:12.5px;color:var(--biru);text-decoration:none;font-weight:600}
  header p{font-size:12.5px;color:#456}
  #paket{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  #panel{right:12px;top:12px;padding:10px 12px;width:268px;max-height:calc(100vh - 150px);overflow:auto}
  #panel h2{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:#678;margin:8px 0 2px}
  #panel h2:first-child{margin-top:0}
  label{display:flex;align-items:center;gap:8px;font-size:13px;padding:3px 0;cursor:pointer;line-height:1.25}
  label i{width:12px;height:12px;border-radius:3px;flex:none;border:1px solid rgba(0,0,0,.15)}
  label input{width:16px;height:16px;accent-color:var(--biru);flex:none}
  label small{margin-left:auto;color:#889;font-size:11px;white-space:nowrap}
  #tutup{display:none}
  nav{left:50%;bottom:calc(12px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:6px;padding:6px;max-width:calc(100vw - 24px);white-space:nowrap}
  button{font:600 13px "Segoe UI",system-ui,sans-serif;color:var(--navy);background:#eef4fa;border:1px solid var(--garis);border-radius:8px;padding:8px 12px;cursor:pointer;white-space:nowrap}
  button[aria-pressed="true"]{background:var(--biru);color:#fff;border-color:var(--biru)}
  .tanda{position:absolute;transform:translate(-50%,-50%);width:26px;height:26px;border-radius:50%;background:var(--biru);color:#fff;border:2px solid #fff;font:700 12px "Segoe UI",sans-serif;display:grid;place-items:center;padding:0;box-shadow:0 2px 6px rgba(0,0,0,.35);pointer-events:auto}
  #tanda{position:fixed;inset:0;pointer-events:none;z-index:1}
  #info{left:12px;bottom:74px;padding:10px 42px 10px 14px;max-width:min(420px,calc(100vw - 24px));display:none}
  #info b{display:block;font-size:14.5px}
  #info span{font-size:12.5px;color:#345}
  #info button{position:absolute;right:6px;top:6px;padding:2px 8px}
  #wm{position:fixed;right:12px;bottom:calc(74px + env(safe-area-inset-bottom));font:700 14px "Segoe UI",sans-serif;background:rgba(255,255,255,.78);padding:5px 10px;border-radius:8px;pointer-events:none;z-index:1}
  #wm2{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;pointer-events:none;overflow:hidden;z-index:1}
  #wm2 span{font:700 clamp(26px,5.5vw,84px) "Segoe UI",sans-serif;color:rgba(14,38,66,.13);transform:rotate(-22deg);white-space:nowrap}
  #muat{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);font-size:14px;background:rgba(255,255,255,.92);padding:10px 16px;border-radius:10px;pointer-events:none;display:none;z-index:3;text-align:center}
  @media(max-width:820px){
    header{right:12px;max-width:none}
    header h1{font-size:14px}
    header p{display:none}
    button{padding:7px 9px;font-size:12.5px}
    #panel{display:none;top:auto;bottom:calc(122px + env(safe-area-inset-bottom));max-height:50vh}
    #panel.buka{display:block;z-index:4}
    #tutup{display:inline-block}
    nav{left:12px;right:12px;transform:none;flex-wrap:wrap;justify-content:center;white-space:normal}
    #wm{bottom:calc(122px + env(safe-area-inset-bottom))}
    #info{bottom:162px}
  }
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
</head>
<body>
<div id="muat"></div>
<div id="tanda"></div>
<header class="kotak">
  <a id="beranda" href="./">← Semua produk</a>
  <h1>Gudang / Workshop Sragen · Model 3D Lengkap</h1>
  <p>18,00 × 60,00 m · 12 petak @ 5,00 m · pondasi Revisi 1 · ketuk bagian mana saja untuk melihat namanya</p>
  <div id="paket">
    <button data-paket="lengkap" aria-pressed="true">Lengkap</button>
    <button data-paket="rangka">Rangka</button>
    <button data-paket="pondasi">Pondasi</button>
    <button data-paket="instalasi">Instalasi</button>
  </div>
</header>
<aside id="panel" class="kotak"><div id="lapisan"></div></aside>
<div id="info" class="kotak"><b></b><span></span><button aria-label="Tutup info">×</button></div>
<div id="wm">DRAFT · gambarexpress.id</div>
<div id="wm2" aria-hidden="true"><span>DRAFT · gambarexpress.id</span><span>DRAFT · gambarexpress.id</span></div>
<nav class="kotak" aria-label="Sudut pandang">
  <button data-pandang="iso">Isometri</button>
  <button data-pandang="depan">Depan</button>
  <button data-pandang="samping">Samping</button>
  <button data-pandang="atas">Atas</button>
  <button data-pandang="dalam">Interior</button>
  <button id="label" aria-pressed="false">Label</button>
  <button id="tutup" aria-pressed="false">Lapisan</button>
</nav>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';

const VERSI = '7';
// titik dalam koordinat model: x lebar, y panjang, z tinggi
const LABEL = [
  ['baja','Kolom tepi','WF396×199 / WF350×175',[17.69,45,2.6]],
  ['baja','Kolom tengah (as 3–8)','WF346×174×6×9',[9,15,3.2]],
  ['baja','Kuda-kuda (rafter)','WF346×174×6×9 · portal crane WF248×124×5×8',[13.5,.2,8.3]],
  ['gording','Gording','C150×50×20×2,3',[14.85,37.5,8.12]],
  ['baja','Ikatan angin','Pelat 10×80, bidang atap dan dinding',[13,57.5,8.3]],
  ['baja','Strut bubungan','2C150',[9,42.5,8.7]],
  ['crane','Crane 5 ton','Overhead single girder, as 3–8',[6,22.5,5.6]],
  ['crane','Balok runway','WF400, rel P22',[8.3,30,4.9]],
  ['gording','Pengikat dinding','Siku L50×5',[17.75,50,4.9]],
  ['pondasi','Pedestal beton','550 × 450, puncak +0,120 (Rev 1)',[17.8,20,.1]],
  ['pondasi','Telapak (cakar ayam)','Dasar -2,000 di tanah asli (Rev 1)',[17.0,35,-1.75]],
  ['batukali','Pondasi batu kali','Lebar atas 300, bawah 700, di bawah sloof (Rev 1)',[17.5,27.5,-.9]],
  ['hujan','Talang','450 × 300, dua sisi',[17.8,12,7.45]],
  ['hujan','Pipa air hujan','Utama + darurat D150',[17.5,18.2,3.4]],
  ['foil','Aluminium foil','Bubble foil di bawah spandek',[12.5,22,8.1]],
  ['pintu','Pintu workshop P1','Lipat-geser 4 daun (usulan)',[14.2,-.15,2.8]],
  ['kanopi','Kanopi beton','Pelat kantilever 2,0 m',[12,-2.3,6.1]],
  ['penunjang','Bangunan penunjang','Kantor, ruang tamu, mushola, toilet, pos jaga',[3,-6,3.6]]];
const PAKET = {
  lengkap:{label:false,tanah:true,ya:null},
  rangka:{label:true,tanah:true,ya:['lantai','pondasi','baja','gording','crane']},
  pondasi:{label:true,tanah:false,ya:['batukali','pondasi','tulangan','baja','beton']},
  instalasi:{label:false,tanah:true,ya:['lantai','baja','gording','hujan','air','listrik','mesin','crane']}};
const ke3 = ([x,y,z]) => new THREE.Vector3(x,z,-y);

const muat = document.getElementById('muat');
const renderer = new THREE.WebGLRenderer({antialias:true, logarithmicDepthBuffer:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color('#dbe9f5');
const camera = new THREE.PerspectiveCamera(35,1,.2,1500);
const kontrol = new OrbitControls(camera, renderer.domElement);
kontrol.enableDamping = true; kontrol.maxDistance = 450; kontrol.minDistance = 1.5;
scene.add(new THREE.HemisphereLight('#ffffff','#8d9482',1.6));
const matahari = new THREE.DirectionalLight('#ffffff',1.7); matahari.position.set(60,80,40); scene.add(matahari);
const isiCahaya = new THREE.DirectionalLight('#eef3ff',1.0); isiCahaya.position.set(-25,30,80); scene.add(isiCahaya);
const tanah = new THREE.Mesh(new THREE.PlaneGeometry(900,900), new THREE.MeshLambertMaterial({color:'#cdd8bd'}));
tanah.rotation.x = -Math.PI/2; tanah.position.set(9,-.34,-20); scene.add(tanah);

let perlu = true;
const minta = ()=>{perlu = true;};
const PANDANG = {
  iso:{p:[1,.55,.72],t:[9,22,2],r:40}, depan:{p:[0,.14,1],t:[9,-8,4],r:17},
  samping:{p:[1,.14,0],t:[9,17,3],r:46}, atas:{p:[.001,1,.001],t:[9,17,0],r:44},
  dalam:{pos:[14.5,5,2.8],t:[7,28,5.4]}};
let aktif = 'iso', disentuh = false;
kontrol.addEventListener('start',()=>{disentuh=true;});
kontrol.addEventListener('change',minta);
function pandang(nama){
  aktif = nama; disentuh = false;
  const v = PANDANG[nama]; const t = ke3(v.t); kontrol.target.copy(t);
  if(v.pos){camera.position.copy(ke3(v.pos));}
  else{
    // jarak mengikuti bentuk layar agar seluruh bangunan terlihat
    const setengah = THREE.MathUtils.degToRad(camera.fov/2);
    const jarak = v.r * (innerWidth>820 ? 1.12 : 1) / (Math.tan(setengah) * Math.max(.45,Math.min(camera.aspect,1.5)));
    camera.position.copy(t).add(new THREE.Vector3(...v.p).normalize().multiplyScalar(jarak));
  }
  kontrol.update(); minta();
}
document.querySelectorAll('[data-pandang]').forEach(b=>b.onclick=()=>pandang(b.dataset.pandang));

// ---------- lapisan dimuat saat pertama kali dinyalakan ----------
const daftar = await fetch(`model/daftar.json?v=${VERSI}`).then(r=>r.json());
const grup = {}, tampil = {}, proses = {}, kotakCentang = {};
const pemuat = new GLTFLoader();
let antre = 0;
function status(){muat.style.display = antre ? 'block' : 'none'; muat.textContent = `Memuat ${antre} lapisan model…`;}
function muatLapisan(id){
  if(proses[id]) return proses[id];
  antre++; status();
  return proses[id] = Promise.all([
    pemuat.loadAsync(`model/${id}.glb?v=${VERSI}`), fetch(`model/${id}.json?v=${VERSI}`).then(r=>r.json())
  ]).then(([gltf,data])=>{
    let i = 0;
    gltf.scene.traverse(o=>{ if(!o.isMesh) return;
      o.material.flatShading = true; o.material.side = THREE.DoubleSide; o.material.needsUpdate = true;
      o.userData = {lapisan:id, bagian:data.bagian[i++], nama:data.nama}; });
    grup[id] = gltf.scene; gltf.scene.visible = tampil[id]; scene.add(gltf.scene);
  }).catch(e=>{ delete proses[id]; console.error(id,e); muat.dataset.gagal=id; })
    .finally(()=>{antre--; status(); minta();});
}
function atur(id, nyala){
  tampil[id] = nyala; kotakCentang[id].checked = nyala;
  if(nyala) muatLapisan(id);
  if(grup[id]) grup[id].visible = nyala;
  minta();
}
const wadahLapisan = document.getElementById('lapisan');
let kelompok = '';
function judulKelompok(t){const h=document.createElement('h2'); h.textContent=t; wadahLapisan.append(h);}
function baris(id,nama,warna,catatan,aksi){
  const l = document.createElement('label');
  l.innerHTML = `<input type="checkbox"><i style="background:${warna}"></i><span>${nama}</span><small>${catatan}</small>`;
  const c = l.querySelector('input'); c.dataset.lapisan = id; kotakCentang[id] = c; c.onchange = ()=>aksi(c.checked); wadahLapisan.append(l);
  return c;
}
for(const d of daftar){
  if(d.kelompok!==kelompok){kelompok=d.kelompok; judulKelompok(kelompok);}
  baris(d.id, d.nama, d.warna, d.kb>1500 ? `${(d.kb/1024).toFixed(1)} MB` : '', v=>{atur(d.id,v); tandaiPaket('');});
}
judulKelompok('Latar');
const cTanah = baris('_tanah','Muka tanah','#cdd8bd','',v=>{tanah.visible=v; minta();});

const info = document.getElementById('info'), wadah = document.getElementById('tanda');
let pakaiLabel = false, sorot = null;
function tutupInfo(){info.style.display='none'; if(sorot){scene.remove(sorot); sorot.material.dispose(); sorot=null;} minta();}
info.querySelector('button').onclick = tutupInfo;
function tampilInfo(judul,isiTeks){info.style.display='block'; info.querySelector('b').textContent=judul; info.querySelector('span').textContent=isiTeks;}
const tanda = LABEL.map(([lap,judul,teks,titik],i)=>{
  const el = document.createElement('button'); el.className='tanda'; el.textContent=i+1; el.setAttribute('aria-label',judul);
  el.onclick = ()=>{tutupInfo(); tampilInfo(`${i+1}. ${judul}`, teks);};
  wadah.append(el); return {el,lap,v:ke3(titik)};
});
const tombolLabel = document.getElementById('label');
function aturLabel(v){pakaiLabel=v; tombolLabel.setAttribute('aria-pressed',v); minta();}
tombolLabel.onclick = ()=>aturLabel(!pakaiLabel);
function tandaiPaket(nama){document.querySelectorAll('[data-paket]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.paket===nama));}
function paket(nama){
  const p = PAKET[nama]; tutupInfo();
  for(const d of daftar) atur(d.id, p.ya ? p.ya.includes(d.id) : !!d.awal);
  tanah.visible = cTanah.checked = p.tanah; aturLabel(p.label); tandaiPaket(nama);
}
document.querySelectorAll('[data-paket]').forEach(b=>b.onclick=()=>paket(b.dataset.paket));
document.getElementById('tutup').onclick = e=>{const b=document.getElementById('panel').classList.toggle('buka'); e.target.setAttribute('aria-pressed',b);};

// ---------- ketuk elemen untuk melihat namanya ----------
const sinar = new THREE.Raycaster(), titikTekan = new THREE.Vector2();
renderer.domElement.addEventListener('pointerdown',e=>titikTekan.set(e.clientX,e.clientY));
renderer.domElement.addEventListener('pointerup',e=>{
  if(Math.hypot(e.clientX-titikTekan.x, e.clientY-titikTekan.y)>6) return;
  tutupInfo();
  camera.updateMatrixWorld();
  const x = e.clientX/innerWidth*2-1, y = 1-e.clientY/innerHeight*2;
  sinar.setFromCamera(new THREE.Vector2(x,y), camera);
  const sasaran = Object.entries(grup).filter(([id])=>tampil[id]).map(([,g])=>g);
  const kena = sinar.intersectObjects(sasaran,true)[0];
  if(!kena) return;
  const o = kena.object, r = o.userData.bagian; if(!r) return;
  let a = 0, b = r.length-1;
  while(a<b){const m=(a+b+1)>>1; if(r[m][0]<=kena.faceIndex) a=m; else b=m-1;}
  const awal = r[a][0]*3, akhir = a+1<r.length ? r[a+1][0]*3 : o.geometry.index.count;
  const g = new THREE.BufferGeometry(); g.setAttribute('position', o.geometry.attributes.position);
  g.setIndex(new THREE.BufferAttribute(o.geometry.index.array.slice(awal,akhir),1));
  sorot = new THREE.Mesh(g, new THREE.MeshBasicMaterial({color:'#ff7a00',side:THREE.DoubleSide,depthTest:false,transparent:true,opacity:.75}));
  sorot.matrixAutoUpdate = false; sorot.matrix.copy(o.matrixWorld); sorot.frustumCulled = false; sorot.renderOrder = 5; scene.add(sorot);
  tampilInfo(o.userData.nama[r[a][1]].replaceAll('|','·'), daftar.find(d=>d.id===o.userData.lapisan).nama);
  minta();
});

function ukur(){const w=innerWidth||1280,h=innerHeight||720; renderer.setSize(w,h); camera.aspect=w/h; if(w>820) camera.setViewOffset(w,h,120,0,w,h); else camera.clearViewOffset(); camera.updateProjectionMatrix(); if(!disentuh) pandang(aktif); minta();}
addEventListener('resize',ukur); ukur(); paket('lengkap');
window.__uji = ()=>({lapisan:daftar.length, termuat:Object.keys(grup).length, antre, gagal:muat.dataset.gagal||''});
const p = new THREE.Vector3();
// gambar ulang hanya saat ada perubahan agar hemat baterai HP
renderer.setAnimationLoop(()=>{
  kontrol.update();
  if(!perlu) return; perlu = false;
  renderer.render(scene,camera);
  for(const t of tanda){
    p.copy(t.v).project(camera);
    const ada = pakaiLabel && tampil[t.lap] && p.z<1 && Math.abs(p.x)<1 && Math.abs(p.y)<1;
    t.el.style.display = ada?'grid':'none';
    if(ada){t.el.style.left=(p.x+1)/2*innerWidth+'px'; t.el.style.top=(1-p.y)/2*innerHeight+'px';}
  }
});
</script>
</body>
</html>
