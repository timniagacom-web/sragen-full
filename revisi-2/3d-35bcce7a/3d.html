<style>
  :root{--navy:#0e2642;--biru:#1f5fa8;--garis:#d5e0ea;--nav:64px}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;font-family:"Segoe UI",system-ui,sans-serif;color:var(--navy);background:#dbe9f5}
  canvas{display:block;touch-action:none}
  .kotak{position:fixed;background:rgba(255,255,255,.95);border:1px solid var(--garis);border-radius:12px;box-shadow:0 4px 18px rgba(14,38,66,.14);z-index:2}
  header{left:12px;top:12px;padding:10px 14px;width:min(400px,calc(100vw - 24px))}
  header h1{font-size:16px;line-height:1.3}
  #beranda{font-size:12.5px;color:var(--biru);text-decoration:none;font-weight:600}
  button{font:600 13px "Segoe UI",system-ui,sans-serif;color:var(--navy);background:#eef4fa;border:1px solid var(--garis);border-radius:8px;padding:8px 11px;cursor:pointer;white-space:nowrap}
  button[aria-pressed="true"]{background:var(--biru);color:#fff;border-color:var(--biru)}
  #tahap{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:8px}
  #tahap button{padding:7px 0;border-bottom:4px solid var(--w,#9ab)}
  #aksi{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
  #putar{background:#f2bd1d;border-color:#d9a50c}
  #kartu{margin-top:9px;border-top:1px solid var(--garis);padding-top:7px}
  #kartu b{font-size:13.5px;display:block}
  #kartu ul{margin:4px 0 0 17px;font-size:12.5px;line-height:1.45;color:#2c4258}
  #panel{right:12px;top:12px;padding:10px 12px;width:268px;max-height:calc(100vh - var(--nav) - 76px);overflow:auto}
  #panel h2{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:#678;margin:8px 0 2px}
  #panel h2:first-child{margin-top:0}
  label{display:flex;align-items:center;gap:8px;font-size:13px;padding:3px 0;cursor:pointer;line-height:1.25}
  label i{width:12px;height:12px;border-radius:3px;flex:none;border:1px solid rgba(0,0,0,.15)}
  label input{width:16px;height:16px;accent-color:var(--biru);flex:none}
  #ringkas{display:none}
  #panel{display:none;top:auto;bottom:calc(var(--nav) + 18px);max-height:62vh;z-index:4}
  #panel.buka{display:block}
  nav{left:50%;bottom:calc(12px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:6px;padding:6px;max-width:calc(100vw - 24px);white-space:nowrap}
  .tanda{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:6px;pointer-events:auto;background:rgba(255,255,255,.94);border:2px solid var(--biru);border-radius:20px;padding:3px 9px;font:600 12px "Segoe UI",sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.25)}
  #tanda{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
  #info{left:12px;bottom:calc(var(--nav) + 14px);padding:10px 42px 10px 14px;max-width:min(420px,calc(100vw - 24px));display:none}
  #info b{display:block;font-size:14.5px}
  #info span{font-size:12.5px;color:#345}
  #info button{position:absolute;right:6px;top:6px;padding:2px 8px}
  #wm{position:fixed;right:12px;bottom:calc(var(--nav) + 12px);font:700 14px "Segoe UI",sans-serif;background:rgba(255,255,255,.78);padding:5px 10px;border-radius:8px;pointer-events:none;z-index:1}
  #wm2{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;pointer-events:none;overflow:hidden;z-index:1}
  #wm2 span{font:700 clamp(26px,5.5vw,84px) "Segoe UI",sans-serif;color:rgba(14,38,66,.13);transform:rotate(-22deg);white-space:nowrap}
  #muat{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);font-size:14px;background:rgba(255,255,255,.92);padding:10px 16px;border-radius:10px;pointer-events:none;display:none;z-index:3}
  @media(max-width:820px){
    :root{--nav:104px}
    header{right:12px;width:auto;padding:8px 10px}
    header h1{font-size:13.5px}
    button{padding:7px 9px;font-size:12.5px}
    #ringkas{display:inline-block}
    #kartu{display:none}
    #kartu.buka{display:block;max-height:34vh;overflow:auto}
    #panel{max-height:48vh}
    nav{left:12px;right:12px;transform:none;flex-wrap:wrap;justify-content:center;white-space:normal}
    .tanda{font-size:10.5px;padding:2px 6px;border-width:1px}
  }
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}

<body>

<header class="kotak">
  <a id="beranda" href="./">← Video dan produk lain</a>
  <h1>Gudang / Workshop Sragen · 3D Revisi 2 · 4 tahap pengerjaan</h1>
  <div id="tahap" role="group" aria-label="Tahap pengerjaan">

<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';

const VERSI = '2';
const WARNA_TAHAP = {1:'#b4562c',2:'#2f7ed8',3:'#e6a117',4:'#2e9e5b',5:'#9b7bb8',0:'#3f8f6b'};
const TAHAP = {
  1:{judul:'Tahap 1 · Persiapan, pondasi dan timbunan',isi:['Pengukuran, bouwplank, pengeringan sawah','Pondasi telapak (cakar ayam), pedestal, stek kolom dan dowel','Pondasi batu kali (talud) dan sloof gudang, termasuk alas pagar','Pondasi dan angkur crane (crane menyusul)','Timbunan tanah ± 1 m dipadatkan']},
  2:{judul:'Tahap 2 · Lantai, kolom beton dan dinding',isi:['Drainase bawah lantai','Lantai gudang cor 20 cm di atas lapis agregat','Cor jalan keluar-masuk truk 7 × 28 m','Kolom beton 350×500, balok kepala, lintel, ring dan praktis','Dinding bata, kisi ventilasi dan pintu gudang']},
  3:{judul:'Tahap 3 · Atap baja',isi:['Rafter WF 298×149, gording C150, ikatan angin','Dinding atas (gevel)','Talang dan pipa air hujan','Aluminium foil dan atap galvalum 0,35','Kanopi rangka hollow di pintu masuk']},
  4:{judul:'Tahap 4 · Bangunan penunjang dan halaman',isi:['Kantor dan ruang tamu (struktur disiapkan 2 lantai), blok depan','Pos jaga, mushola, KM dan tempat wudhu','Sanitair dan air','Paving halaman','Pagar dan portal']},
  5:{judul:'Bangunan selesai 4 tahap',isi:['Seluruh pekerjaan tahap 1 sampai 4','Pilih angka tahap untuk melihat urutannya','Ketuk bagian mana saja untuk melihat namanya']},
  6:{judul:'Menyusul · di luar 4 tahap',isi:['Crane 5 t: kolom baja sendiri, runway dan jembatan','Lantai 2 kantor','Atap gudang disembunyikan agar crane terlihat']}};
// [tahap, judul, titik model: x lebar, y panjang, z tinggi]
const LABEL = [
  [1,'telapak','Telapak (cakar ayam), dasar -2,00',[1.2,10,-1.75]],[1,'besi1','Stek kolom 12D16',[.35,15,1.9]],[1,'batukali','Pondasi batu kali',[.2,30,-.8]],[1,'sloof','Sloof 200×300',[.05,42,-.2]],[1,'angkur','Angkur pondasi crane',[9,20,.2]],[1,'urugan','Timbunan padat',[9,50,-.35]],
  [2,'lantai','Lantai cor 20 cm',[9,40,0]],[2,'kolom','Kolom beton 350×500',[.3,25,4]],[2,'balok','Balok kepala 200×350',[.45,40,6.8]],[2,'balok','Lintel pintu 300×500',[14,0,5.55]],[2,'dinding','Dinding bata',[0,52,3]],[2,'jalan','Cor jalan truk',[14.4,-15,-.15]],
  [3,'baja','Rafter WF 298×149',[4.5,.3,8.2]],[3,'gording','Gording C150',[14.8,37.5,8.2]],[3,'talang','Talang',[.2,12,7.3]],[3,'atap','Atap galvalum 0,35',[13,25,8.5]],[3,'kanopi','Kanopi hollow',[12,-2,6]],
  [4,'kantor','Kantor dan ruang tamu',[3,-4,3.6]],[4,'penunjang','Pos jaga dan mushola',[6,-24,3.4]],[4,'halaman','Paving halaman',[14,-19,-.2]],[4,'pagar','Pagar dan portal',[5,-26,4.2]],
  [6,'crane','Crane 5 t',[9,22.5,5.6]],[6,'kantor2','Lantai 2 kantor',[3,-4,7.8]]];
const LABEL_SELESAI = ['Rafter WF 298×149','Atap galvalum 0,35','Dinding bata','Kantor dan ruang tamu','Pos jaga dan mushola','Pagar dan portal','Kanopi hollow','Cor jalan truk'];
const BETON = ['urugan','telapak','pedestal','sloof','batukali','agregat','lantai','jalan','kolom','balok','kantor','dinding','praktis','lantaikerja'];
const BESI = ['besi1','besi2','besi4'];
const ke3 = ([x,y,z]) => new THREE.Vector3(x,z,-y);

const $ = id => document.getElementById(id);
const muat = $('muat');
const renderer = new THREE.WebGLRenderer({antialias:true, logarithmicDepthBuffer:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color('#dbe9f5');
const camera = new THREE.PerspectiveCamera(35,1,.2,1500);
const kontrol = new OrbitControls(camera, renderer.domElement);
kontrol.enableDamping = true; kontrol.maxDistance = 450; kontrol.minDistance = 1.5;
scene.add(new THREE.HemisphereLight('#ffffff','#8d9482',1.6));
const matahari = new THREE.DirectionalLight('#ffffff',1.7); matahari.position.set(60,80,40); scene.add(matahari);
const isiCahaya = new THREE.DirectionalLight('#eef3ff',1.0); isiCahaya.position.set(-25,30,80); scene.add(isiCahaya);

// muka sawah -1,00 dengan area lahan terbuka (galian) agar pondasi terlihat
const tanah = new THREE.Group(); scene.add(tanah);
const bentuk = new THREE.Shape([[-450,-450],[450,-450],[450,450],[-450,450]].map(p=>new THREE.Vector2(...p)));
bentuk.holes.push(new THREE.Path([[-.5,-28.6],[18.5,-28.6],[18.5,60.6],[-.5,60.6]].map(p=>new THREE.Vector2(...p))));
const sawah = new THREE.Mesh(new THREE.ShapeGeometry(bentuk), new THREE.MeshLambertMaterial({color:'#cdd8bd',side:THREE.DoubleSide}));
sawah.rotation.x = -Math.PI/2; sawah.position.y = -1.0; tanah.add(sawah);
const dasar = new THREE.Mesh(new THREE.PlaneGeometry(19,89.2), new THREE.MeshLambertMaterial({color:'#b39a77'}));
dasar.rotation.x = -Math.PI/2; dasar.position.set(9,-2.08,-16); tanah.add(dasar);

let perlu = true;
const minta = ()=>{perlu = true;};
const PANDANG = {
  iso:{p:[-1,.62,.78],t:[9,17,1],r:46}, depan:{p:[0,.2,1],t:[9,-10,3],r:19},
  samping:{p:[-1,.16,0],t:[9,16,2],r:52}, atas:{p:[-.001,1,.001],t:[9,16,0],r:50},
  pondasi:{pos:[-13,-9,10],t:[7,14,-1.2]}, dalam:{pos:[14.5,5,2.8],t:[7,28,5.4]}};
let aktifPandang = 'iso', disentuh = false;
kontrol.addEventListener('start',()=>{disentuh=true;});
kontrol.addEventListener('change',minta);
function pandang(nama){
  aktifPandang = nama; disentuh = false;
  // layar tegak (HP): isometri dilihat dari depan agar bangunan panjang mengisi layar
  const v = nama==='iso' && camera.aspect<.8 ? {p:[-.38,.8,.95],t:[9,12,1],r:30} : PANDANG[nama]; const t = ke3(v.t); kontrol.target.copy(t);
  if(v.pos){camera.position.copy(ke3(v.pos));}
  else{
    // jarak mengikuti bentuk layar agar seluruh bangunan terlihat
    const setengah = THREE.MathUtils.degToRad(camera.fov/2);
    const jarak = v.r * (innerWidth>820 ? 1.1 : 1.05) / (Math.tan(setengah) * Math.max(.45,Math.min(camera.aspect,1.5)));
    camera.position.copy(t).add(new THREE.Vector3(...v.p).normalize().multiplyScalar(jarak));
  }
  kontrol.update(); minta();
}
document.querySelectorAll('[data-pandang]').forEach(b=>b.onclick=()=>pandang(b.dataset.pandang));

// ---------- lapisan ----------
const daftar = await fetch(`model/daftar.json?v=${VERSI}`).then(r=>r.json());
const infoLap = Object.fromEntries(daftar.map(d=>[d.id,d]));
const grup = {}, tampil = {}, proses = {}, centang = {};
let tahapAktif = 5, pakaiWarna = false, pakaiBesi = false, pakaiLabel = true, putaran = 0;
const pemuat = new GLTFLoader();
let antre = 0;
function status(){muat.style.display = antre ? 'block' : 'none'; muat.textContent = `Memuat ${antre} lapisan model…`;}
function muatLapisan(id){
  if(proses[id]) return proses[id];
  antre++; status();
  return proses[id] = Promise.all([
    pemuat.loadAsync(`model/${id}.glb?v=${VERSI}`), fetch(`model/${id}.json?v=${VERSI}`).then(r=>r.json())
  ]).then(([gltf,data])=>{
    gltf.scene.traverse(o=>{ if(!o.isMesh) return;
      o.material.flatShading = true; o.material.side = THREE.DoubleSide;
      o.userData = {lapisan:id, bagian:data.bagian, nama:data.nama, asli:o.material.color.clone()}; });
    grup[id] = gltf.scene; gltf.scene.visible = tampil[id]; scene.add(gltf.scene); gaya(id);
  }).catch(e=>{ delete proses[id]; console.error(id,e); muat.dataset.gagal=id; })
    .finally(()=>{antre--; status(); minta();});
}
function gaya(id){
  const g = grup[id]; if(!g) return; const t = infoLap[id].tahap;
  g.traverse(o=>{ if(!o.isMesh) return; const m = o.material;
    if(pakaiWarna) m.color.set(WARNA_TAHAP[t]);
    else if(tahapAktif<=4 && t>=1 && t<tahapAktif) m.color.set('#c3c9ce');      // tahap sebelumnya diabu-abukan
    else m.color.copy(o.userData.asli);
    let op = 1;
    if(id==='urugan' && tahapAktif===1) op = .3;
    if(pakaiBesi && BETON.includes(id)) op = id==='urugan' ? .06 : id==='dinding' ? .1 : .3;
    m.opacity = op; m.transparent = op<1; m.depthWrite = op===1; m.needsUpdate = true; });
  minta();
}
const semuaGaya = ()=>Object.keys(grup).forEach(gaya);
function atur(id, nyala){
  tampil[id] = nyala; centang[id].checked = nyala;
  if(nyala) muatLapisan(id);
  if(grup[id]){grup[id].visible = nyala; grup[id].position.y = 0;}
  minta();
}
const wadah = $('lapisan');
function judulKelompok(t){const h=document.createElement('h2'); h.textContent=t; wadah.append(h);}
function baris(id,nama,warna,aksi){
  const l = document.createElement('label');
  l.innerHTML = `<input type="checkbox"><i style="background:${warna}"></i><span>${nama}</span>`;
  const c = l.querySelector('input'); c.dataset.lapisan = id; centang[id] = c; c.onchange = ()=>aksi(c.checked); wadah.append(l);
  return c;
}
let kelompok = null;
for(const d of daftar){
  if(d.tahap!==kelompok){kelompok=d.tahap; judulKelompok(d.tahap===5?'Menyusul':d.tahap===0?'Studi':`Tahap ${d.tahap}`);}
  baris(d.id, d.nama, d.warna, v=>atur(d.id,v));
}
judulKelompok('Latar');
const cTanah = baris('_tanah','Muka sawah dan galian','#cdd8bd',v=>{tanah.visible=v; minta();});
cTanah.checked = true;

// lapisan yang tampil pada tiap pilihan tahap
function tampilDi(d, n){
  if(d.tahap===0) return false;
  if(n<=4) return d.tahap<=n && (!BESI.includes(d.id) || d.tahap===n || pakaiBesi);
  if(n===5) return d.tahap<=4 && (!BESI.includes(d.id) || pakaiBesi);
  return !['atap','foil'].includes(d.id) && (!BESI.includes(d.id) || pakaiBesi);
}
function kartu(n){
  $('kartu').querySelector('b').textContent = TAHAP[n].judul;
  $('kartu').querySelector('ul').replaceChildren(...TAHAP[n].isi.map(t=>{const li=document.createElement('li'); li.textContent=t; return li;}));
  document.querySelectorAll('[data-tahap]').forEach(b=>b.setAttribute('aria-pressed', +b.dataset.tahap===n));
}
function pilihTahap(n){
  tahapAktif = n; tutupInfo(); kartu(n);
  for(const d of daftar) atur(d.id, tampilDi(d,n));
  semuaGaya(); minta();
}
function hentikan(){putaran++; $('putar').textContent='▶ Putar tahapan';}
document.querySelectorAll('[data-tahap]').forEach(b=>b.onclick=()=>{hentikan(); pilihTahap(+b.dataset.tahap);});

// ---------- putar tahapan: lapisan datang satu per satu ----------
const tunggu = ms => new Promise(r=>setTimeout(r,ms));
const turun = new Map();
async function putar(){
  const ini = ++putaran; $('putar').textContent='■ Hentikan';
  tutupInfo(); pandang('iso');
  await Promise.all(daftar.filter(d=>d.tahap>=1&&d.tahap<=4).map(d=>muatLapisan(d.id)));
  for(const n of [1,2,3,4]){
    if(ini!==putaran) return;
    tahapAktif = n; kartu(n); semuaGaya();
    for(const d of daftar) atur(d.id, d.tahap>=1 && d.tahap<n && !BESI.includes(d.id));
    await tunggu(900);
    // tulangan dipasang lebih dulu, baru betonnya
    const urut = daftar.filter(d=>d.tahap===n);
    const mulai = {1:['lantaikerja','besi1','telapak','pedestal','angkur','batukali','sloof','urugan'],2:['drainase','agregat','besi2','lantai','jalan','kolom','balok','dinding','praktis','kisi','pintu']}[n];
    if(mulai) urut.sort((a,b)=>mulai.indexOf(a.id)-mulai.indexOf(b.id));
    for(const d of urut){
      if(ini!==putaran) return;
      atur(d.id,true); turun.set(d.id, performance.now()); await tunggu(950);
    }
    await tunggu(2200);
  }
  if(ini!==putaran) return;
  pilihTahap(5); hentikan();
}
$('putar').onclick = ()=>{ if($('putar').textContent.startsWith('■')){hentikan(); pilihTahap(tahapAktif);} else putar(); };
$('warna').onclick = e=>{pakaiWarna=!pakaiWarna; e.target.setAttribute('aria-pressed',pakaiWarna); semuaGaya();};
$('besi').onclick = e=>{pakaiBesi=!pakaiBesi; e.target.setAttribute('aria-pressed',pakaiBesi); hentikan(); pilihTahap(tahapAktif);};
$('ringkas').onclick = e=>{const b=$('kartu').classList.toggle('buka'); e.target.setAttribute('aria-pressed',b);};
$('tutup').onclick = e=>{const b=$('panel').classList.toggle('buka'); e.target.setAttribute('aria-pressed',b);};

// ---------- label dan ketuk elemen ----------
const info = $('info');
let sorot = null;
function tutupInfo(){info.style.display='none'; if(sorot){scene.remove(sorot); sorot.material.dispose(); sorot=null;} minta();}
info.querySelector('button').onclick = tutupInfo;
function tampilInfo(judul,isiTeks){info.style.display='block'; info.querySelector('b').textContent=judul; info.querySelector('span').textContent=isiTeks;}
const tanda = LABEL.map(([t,lap,judul,titik])=>{
  const el = document.createElement('div'); el.className='tanda'; el.textContent=judul; $('tanda').append(el); return {el,t,lap,judul,v:ke3(titik)};
});
$('label').onclick = e=>{pakaiLabel=!pakaiLabel; e.target.setAttribute('aria-pressed',pakaiLabel); minta();};

const sinar = new THREE.Raycaster(), titikTekan = new THREE.Vector2();
renderer.domElement.addEventListener('pointerdown',e=>titikTekan.set(e.clientX,e.clientY));
renderer.domElement.addEventListener('pointerup',e=>{
  if(Math.hypot(e.clientX-titikTekan.x, e.clientY-titikTekan.y)>6) return;
  tutupInfo(); camera.updateMatrixWorld();
  sinar.setFromCamera(new THREE.Vector2(e.clientX/innerWidth*2-1, 1-e.clientY/innerHeight*2), camera);
  const sasaran = Object.entries(grup).filter(([id])=>tampil[id]).map(([,g])=>g);
  // benda tembus pandang dilewati bila di belakangnya ada benda padat
  const semua = sinar.intersectObjects(sasaran,true);
  const kena = semua.find(k=>!k.object.material.transparent) || semua[0];
  if(!kena) return;
  const o = kena.object, r = o.userData.bagian; if(!r) return;
  let a = 0, b = r.length-1;
  while(a<b){const m=(a+b+1)>>1; if(r[m][0]<=kena.faceIndex) a=m; else b=m-1;}
  const awal = r[a][0]*3, akhir = a+1<r.length ? r[a+1][0]*3 : o.geometry.index.count;
  const g = new THREE.BufferGeometry(); g.setAttribute('position', o.geometry.attributes.position);
  g.setIndex(new THREE.BufferAttribute(o.geometry.index.array.slice(awal,akhir),1));
  sorot = new THREE.Mesh(g, new THREE.MeshBasicMaterial({color:'#ff7a00',side:THREE.DoubleSide,depthTest:false,transparent:true,opacity:.75}));
  sorot.matrixAutoUpdate = false; sorot.matrix.copy(o.matrixWorld); sorot.frustumCulled = false; sorot.renderOrder = 5; scene.add(sorot);
  const d = infoLap[o.userData.lapisan];
  tampilInfo(o.userData.nama[r[a][1]].replaceAll('|','·'), `${d.nama} · ${d.tahap===5?'menyusul, di luar 4 tahap':d.tahap===0?'studi tata mesin':'Tahap '+d.tahap}`);
  minta();
});

function ukur(){const w=innerWidth||1280,h=innerHeight||720; renderer.setSize(w,h); camera.aspect=w/h;
  if(w>820) camera.setViewOffset(w,h,-Math.min(190,Math.round(w*.14)),-20,w,h); else camera.setViewOffset(w,h,0,-Math.round(h*.07),w,h);
  camera.updateProjectionMatrix(); if(!disentuh) pandang(aktifPandang); minta();}
addEventListener('resize',ukur); ukur();
const awalTahap = +new URLSearchParams(location.search).get('tahap'); pilihTahap(TAHAP[awalTahap] ? awalTahap : 5);
window.__uji = ()=>({lapisan:daftar.length, termuat:Object.keys(grup).length, antre, gagal:muat.dataset.gagal||'', tahap:tahapAktif, tampil:Object.keys(tampil).filter(k=>tampil[k])});
const p = new THREE.Vector3();
// gambar ulang hanya saat ada perubahan agar hemat baterai HP
renderer.setAnimationLoop(()=>{
  const kini = performance.now();
  for(const [id,t0] of turun){const k=Math.min(1,(kini-t0)/700); if(grup[id]) grup[id].position.y = 3.5*Math.pow(1-k,3); if(k>=1) turun.delete(id); perlu=true;}
  kontrol.update();
  if(!perlu) return; perlu = false;
  renderer.render(scene,camera);
  const dipakai = [];
  for(const t of tanda){
    p.copy(t.v).project(camera);
    const cocok = tahapAktif===5 ? LABEL_SELESAI.includes(t.judul) : t.t===tahapAktif;
    let ada = pakaiLabel && cocok && tampil[t.lap] && p.z<1 && Math.abs(p.x)<.97 && Math.abs(p.y)<.97;
    const x=(p.x+1)/2*innerWidth, y=(1-p.y)/2*innerHeight;
    if(ada && dipakai.some(([a,b])=>Math.abs(a-x)<110 && Math.abs(b-y)<24)) ada=false;       // hindari label bertumpuk
    t.el.style.display = ada?'flex':'none';
    if(ada){dipakai.push([x,y]); t.el.style.left=x+'px'; t.el.style.top=y+'px';}
  }
});
</script>
</body>
